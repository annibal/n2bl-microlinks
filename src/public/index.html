<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroLinks!</title>
    <link rel="stylesheet" href="/micro-styles.css" />
  </head>
  <body>
    <header class="container">
      <h1 id="microlinks--title">MicroLinks</h1>
      <p class="tagline">
        Turn your <b class="tagline__links">LINKS</b> into <b class="tagline__micro">MICRO</b><b class="tagline__links">LINKS</b> !!
      </p>
    </header>

    <main class="container">
      
      <div class="card__actions fcenter" id="formCardReopener">
        <button id="makeAnotherMicrolink">Make another MicroLink!</button>
      </div>

      <article class="card card--form" id="cardForm">
        <form id="microlinks-form">
          <div class="card__body">
            <div class="form-field">
              <label for="mlf-url">Link URL:</label>
              <input id="mlf-url" name="mlf-url" type="url" required placeholder="http://www.YOUR-LINK-HERE.com" />
              <span id="mlf-url__error"></span>
            </div>

            <details>
              <summary>Advanced Options</summary>

              <div id="advanced-options">
                <div class="form-field">
                  <label for="mlf-micro">Custom MICRO:</label>
                  <input id="mlf-micro" name="mlf-micro" type="text" placeholder="MY-CRO" />
                  <span id="mlf-micro__error"></span>
                </div>

                <div class="form-field">
                  <label for="mlf-label">Give a name for your MICROLINK:</label>
                  <input id="mlf-label" name="mlf-label" type="text" placeholder="Robson" />
                  <span id="mlf-label__error"></span>
                </div>

                <div class="form-field">
                  <label for="mlf-passcode">Deletion Passcode (microlinks without passcode cannot be deleted):</label>
                  <input id="mlf-passcode" name="mlf-passcode" type="text" placeholder="It's a feature for the future" maxlength="255" />
                  <span id="mlf-passcode__error"></span>
                </div>
              </div>
            </details>
          </div>
          <div class="card__actions">
            <button type="submit">Make it MICRO!</button>
          </div>
        </form>
      </article>

      <article class="card card--result hidden" id="cardResult">
        <h2 class="card__title fcenter">Your microlink is:</h2>
        <div class="card__body fcenter">
          <a id="microlinks-result" class="fcenter tagline__micro" target="_blank">http://microlinks.io/5HRT3N</a>
          <p id="microlinks-error"></p>
        </div>
        <div class="card__actions fcenter">
          <button id="microlinks-copy">Copy</button>
          <button id="microlinks-share">Share</button>
          <button id="microlinks-what">Appreciate</button>
        </div>
      </article>

      <article class="card card--history hidden" id="cardHistory">
        <h2 class="card__title">Your microlinks today:</h2>
        <div class="card__body">
          <ul class="mlhist" id="microlinks-history-list">
            
          </ul>
        </div>
      </article>
    </main>

    <script src="/micro-scripts.js"></script>
  </body>
</html>
